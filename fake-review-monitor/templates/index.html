<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="AI-based fake review risk analysis">

    <title>AI Fake Review Monitor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI Fake Review Monitor</h1>

        <p class="subtitle">
            AI-based fake review risk analysis
            <br>
            Paste a review in the box
        </p>

        <textarea id="review" placeholder="Enter a product review here..." maxlength="5000"
            spellcheck="true"></textarea>

        <div class="samples">

            <button type="button" onclick="useSample('genuine')">
                Genuine Sample
            </button>

            <button type="button" onclick="useSample('fake')">
                Suspicious Sample
            </button>

        </div>

        <button id="analyzeButton" type="button" onclick="analyzeReview()">
            Analyze Review
        </button>

        <p id="loading" class="hidden" aria-live="polite">
            Analyzing...
        </p>

        <p id="error" class="error" role="alert" aria-live="assertive"></p>


        <div id="result" class="result hidden">

            <h2 id="prediction"></h2>


            <div class="card">

                <strong>
                    Fake Probability
                </strong>

                <span id="fakeProbability"></span>

            </div>


            <div class="card">

                <strong>
                    Risk Level
                </strong>

                <span id="riskLevel"></span>

            </div>


            <div class="scores">

                <div class="card">

                    <strong>
                        ML Probability
                    </strong>

                    <span id="mlProbability"></span>

                </div>


                <div class="card">

                    <strong>
                        Semantic Probability
                    </strong>

                    <span id="semanticProbability"></span>

                </div>


                <div class="card">

                    <strong>
                        Heuristic Score
                    </strong>

                    <span id="heuristicScore"></span>

                </div>

            </div>


            <div class="card">

                <strong>
                    Reasons
                </strong>

                <ul id="reasons"></ul>

            </div>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>

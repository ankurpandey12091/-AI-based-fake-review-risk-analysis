services:
  - type: web
    name: fake-review-monitor
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python -m nltk.downloader punkt punkt_tab stopwords wordnet"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
